  <g font-family="Arial, Helvetica, sans-serif" fill="#1A1A1A">
    <text x="24" y="36" font-size="17" font-weight="600">Thoracic radiograph classification: data flow and evaluation</text>
    <text x="24" y="56" font-size="11.5" fill="#5A6570">ChestX-ray8 multi-label pipeline: DenseNet121 backbone, frequency-weighted loss, Grad-CAM interpretation and radiologist benchmarking</text>
    <line x1="24" y1="70" x2="1256" y2="70" stroke="#DDE2E7" stroke-width="1"/>
    <rect x="24" y="100" width="196" height="262" rx="7" fill="#EEF4F8" stroke="#2C5F7C" stroke-width="1.3"/>
    <rect x="244" y="100" width="160" height="262" rx="7" fill="#EBF3ED" stroke="#35715A" stroke-width="1.3"/>
    <rect x="428" y="100" width="300" height="262" rx="7" fill="#EBF3ED" stroke="#35715A" stroke-width="1.3"/>
    <rect x="752" y="100" width="504" height="126" rx="7" fill="#FBF2E9" stroke="#A9651F" stroke-width="1.3"/>
