    <rect x="864" y="390" width="392" height="180" rx="7" fill="#EEF4F8" stroke="#2C5F7C" stroke-width="1.3"/>
    <line x1="224" y1="231" x2="240" y2="231" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/><line x1="408" y1="231" x2="424" y2="231" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M 728 231 L 740 231 M 740 163 L 740 299" stroke="#3C4A54" stroke-width="1.6" fill="none"/>
    <line x1="740" y1="163" x2="748" y2="163" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/><line x1="740" y1="299" x2="748" y2="299" stroke="#3C4A54" stroke-width="1.6" marker-end="url(#ah)"/>
    <path d="M 1004 362 L 1004 374 L 640 374 L 640 384" stroke="#3C4A54" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
    <text x="36" y="120" font-size="12.5" font-weight="700">a</text><text x="52" y="120" font-size="12" font-weight="600">Input radiograph</text>
    <use href="#cxr" transform="translate(40,132)"/>
    <rect x="40" y="132" width="164" height="174" fill="none" stroke="#2C5F7C" stroke-width="1"/><text x="48" y="148" font-size="9" fill="#D8D8DE" font-weight="700">R</text>
    <text x="36" y="324" font-size="9.5" fill="#45505A"><tspan x="36" dy="0">ChestX-ray8 frontal projection</tspan><tspan x="36" dy="14">14 binary pathology labels</tspan><tspan x="36" dy="14">Patient-level train / validation split</tspan></text>
    <text x="256" y="120" font-size="12.5" font-weight="700">b</text><text x="272" y="120" font-size="12" font-weight="600">Preprocessing</text>
    <g transform="translate(262,140)"><rect x="0" y="0" width="62" height="62" fill="#ffffff" stroke="#9AA3AB" stroke-width="1" stroke-dasharray="4 3"/><line x1="66" y1="31" x2="80" y2="31" stroke="#3C4A54" stroke-width="1.4" marker-end="url(#ah)"/><rect x="84" y="11" width="40" height="40" fill="#D8E8DD" stroke="#35715A" stroke-width="1.2"/><text x="31" y="76" font-size="8.5" fill="#5A6570" text-anchor="middle">1024 px</text><text x="104" y="76" font-size="8.5" fill="#5A6570" text-anchor="middle">320 px</text></g>
    <g transform="translate(268,236)"><line x1="0" y1="46" x2="96" y2="46" stroke="#6B7780" stroke-width="1.1"/><rect x="4" y="36" width="11" height="10" fill="#BBD4C4"/><rect x="19" y="24" width="11" height="22" fill="#BBD4C4"/><rect x="34" y="10" width="11" height="36" fill="#8FBBA1"/><rect x="49" y="16" width="11" height="30" fill="#8FBBA1"/><rect x="64" y="30" width="11" height="16" fill="#BBD4C4"/><rect x="79" y="38" width="11" height="8" fill="#BBD4C4"/><path d="M 4 40 Q 26 4 46 14 Q 68 26 92 42" fill="none" stroke="#35715A" stroke-width="1.6"/><text x="48" y="60" font-size="8.5" fill="#5A6570" text-anchor="middle">zero mean, unit variance</text></g>
    <text x="256" y="324" font-size="9.5" fill="#45505A"><tspan x="256" dy="0">Resize to 320 x 320</tspan><tspan x="256" dy="14">Per-channel standardisation</tspan><tspan x="256" dy="14">Shift, zoom, flip augmentation</tspan></text>
    <text x="440" y="120" font-size="12.5" font-weight="700">c</text><text x="456" y="120" font-size="12" font-weight="600">DenseNet121 backbone</text>
    <g transform="translate(444,140)">
      <rect x="0" y="24" width="14" height="130" fill="url(#slab)" stroke="#2C5F7C" stroke-width="0.8"/><rect x="46" y="37" width="18" height="104" fill="url(#slab)" stroke="#2C5F7C" stroke-width="0.8"/><rect x="92" y="49" width="22" height="80" fill="url(#slab)" stroke="#2C5F7C" stroke-width="0.8"/>
      <rect x="138" y="60" width="26" height="58" fill="url(#slab)" stroke="#2C5F7C" stroke-width="0.8"/><rect x="184" y="69" width="30" height="40" fill="url(#slab)" stroke="#2C5F7C" stroke-width="0.8"/>
      <path d="M 16 89 L 42 89 M 66 89 L 88 89 M 116 89 L 134 89 M 166 89 L 180 89" stroke="#3C4A54" stroke-width="1.3" fill="none"/>
      <path d="M 7 20 Q 30 0 55 33 M 55 33 Q 78 8 103 45 M 103 45 Q 126 24 151 56 M 151 56 Q 174 38 199 65" fill="none" stroke="#35715A" stroke-width="1" stroke-dasharray="3 2"/>
      <circle cx="234" cy="89" r="12" fill="#ffffff" stroke="#35715A" stroke-width="1.4"/><text x="234" y="92" font-size="7.5" fill="#35715A" text-anchor="middle" font-weight="700">GAP</text><path d="M 216 89 L 220 89 M 248 89 L 254 89" stroke="#3C4A54" stroke-width="1.3" marker-end="url(#ah)"/>
      <g fill="#A9651F"><rect x="258" y="40" width="12" height="6" rx="1"/><rect x="258" y="48" width="12" height="6" rx="1"/><rect x="258" y="56" width="12" height="6" rx="1"/><rect x="258" y="64" width="12" height="6" rx="1"/><rect x="258" y="72" width="12" height="6" rx="1"/><rect x="258" y="80" width="12" height="6" rx="1"/><rect x="258" y="88" width="12" height="6" rx="1"/><rect x="258" y="96" width="12" height="6" rx="1"/><rect x="258" y="104" width="12" height="6" rx="1"/><rect x="258" y="112" width="12" height="6" rx="1"/><rect x="258" y="120" width="12" height="6" rx="1"/><rect x="258" y="128" width="12" height="6" rx="1"/><rect x="258" y="136" width="12" height="6" rx="1"/><rect x="258" y="144" width="12" height="6" rx="1"/></g>
      <text font-size="8" fill="#5A6570" text-anchor="middle"><tspan x="7" y="170">320</tspan><tspan x="55" y="170">80</tspan><tspan x="103" y="170">40</tspan><tspan x="151" y="170">20</tspan><tspan x="199" y="170">10</tspan></text><text x="264" y="170" font-size="8" fill="#5A6570" text-anchor="middle">14</text>
    </g>
    <text x="440" y="324" font-size="9.5" fill="#45505A"><tspan x="440" dy="0">Four dense blocks, growth rate 32, ImageNet initialisation</tspan><tspan x="440" dy="14">Frequency-weighted binary cross-entropy for class imbalance</tspan><tspan x="440" dy="14">Global average pooling into 14 independent sigmoid units</tspan></text>
    <text x="764" y="120" font-size="12.5" font-weight="700">d</text><text x="780" y="120" font-size="12" font-weight="600">Multi-label probability output</text>
    <text font-size="8.5" fill="#45505A"><tspan x="766" y="141">Atelectasis</tspan><tspan x="766" y="153">Cardiomegaly</tspan><tspan x="766" y="165">Consolidation</tspan><tspan x="766" y="177">Edema</tspan><tspan x="766" y="189">Effusion</tspan><tspan x="766" y="201">Emphysema</tspan><tspan x="766" y="213">Fibrosis</tspan></text>
    <text font-size="8.5" fill="#45505A"><tspan x="1006" y="141">Hernia</tspan><tspan x="1006" y="153">Infiltration</tspan><tspan x="1006" y="165">Mass</tspan><tspan x="1006" y="177">Nodule</tspan><tspan x="1006" y="189">Pleural thickening</tspan><tspan x="1006" y="201">Pneumonia</tspan><tspan x="1006" y="213">Pneumothorax</tspan></text>
    <g fill="#EFE4D6"><rect x="858" y="135" width="120" height="7" rx="2"/><rect x="858" y="147" width="120" height="7" rx="2"/><rect x="858" y="159" width="120" height="7" rx="2"/><rect x="858" y="171" width="120" height="7" rx="2"/><rect x="858" y="183" width="120" height="7" rx="2"/><rect x="858" y="195" width="120" height="7" rx="2"/><rect x="858" y="207" width="120" height="7" rx="2"/><rect x="1108" y="135" width="120" height="7" rx="2"/><rect x="1108" y="147" width="120" height="7" rx="2"/><rect x="1108" y="159" width="120" height="7" rx="2"/><rect x="1108" y="171" width="120" height="7" rx="2"/><rect x="1108" y="183" width="120" height="7" rx="2"/><rect x="1108" y="195" width="120" height="7" rx="2"/><rect x="1108" y="207" width="120" height="7" rx="2"/></g>
    <g fill="#A9651F"><rect x="858" y="135" width="62" height="7" rx="2"/><rect x="858" y="147" width="88" height="7" rx="2"/><rect x="858" y="159" width="40" height="7" rx="2"/><rect x="858" y="171" width="34" height="7" rx="2"/><rect x="858" y="183" width="96" height="7" rx="2"/><rect x="858" y="195" width="28" height="7" rx="2"/><rect x="858" y="207" width="22" height="7" rx="2"/><rect x="1108" y="135" width="14" height="7" rx="2"/><rect x="1108" y="147" width="72" height="7" rx="2"/><rect x="1108" y="159" width="46" height="7" rx="2"/><rect x="1108" y="171" width="38" height="7" rx="2"/><rect x="1108" y="183" width="30" height="7" rx="2"/><rect x="1108" y="195" width="54" height="7" rx="2"/><rect x="1108" y="207" width="44" height="7" rx="2"/></g>
    <text x="764" y="256" font-size="12.5" font-weight="700">e</text><text x="780" y="256" font-size="12" font-weight="600">Grad-CAM localisation</text>
    <use href="#cxr" transform="translate(766,266) scale(0.36)"/><ellipse cx="790" cy="306" rx="17" ry="14" fill="url(#cam)"/><rect x="766" y="266" width="59" height="63" fill="none" stroke="#A9651F" stroke-width="1"/>
    <use href="#cxr" transform="translate(836,266) scale(0.36)"/><ellipse cx="877" cy="312" rx="14" ry="11" fill="url(#cam)"/><rect x="836" y="266" width="59" height="63" fill="none" stroke="#A9651F" stroke-width="1"/>
    <use href="#cxr" transform="translate(906,266) scale(0.36)"/><ellipse cx="923" cy="290" rx="11" ry="9" fill="url(#cam)"/><rect x="906" y="266" width="59" height="63" fill="none" stroke="#A9651F" stroke-width="1"/>
    <text font-size="8" fill="#5A6570" text-anchor="middle"><tspan x="795" y="343">Cardiomegaly</tspan><tspan x="865" y="343">Effusion</tspan><tspan x="935" y="343">Mass</tspan></text>
    <rect x="992" y="272" width="120" height="9" rx="2" fill="url(#cbar)" stroke="#C7CDD3" stroke-width="0.6"/><text x="992" y="294" font-size="8" fill="#5A6570">low</text><text x="1112" y="294" font-size="8" fill="#5A6570" text-anchor="end">high activation</text>
    <text x="992" y="314" font-size="9.5" fill="#45505A"><tspan x="992" dy="0">Class-activation maps taken from the</tspan><tspan x="992" dy="14">final convolutional block, bilinearly</tspan><tspan x="992" dy="14">upsampled and blended onto the input</tspan></text>
    <text x="36" y="410" font-size="12.5" font-weight="700">f</text><text x="52" y="410" font-size="12" font-weight="600">Discrimination</text>
    <g transform="translate(48,424)"><path d="M 0 110 L 0 0 M 0 110 L 110 110" fill="none" stroke="#6B7780" stroke-width="1.1"/><path d="M 0 110 L 110 0" fill="none" stroke="#B9B0CF" stroke-width="1" stroke-dasharray="4 3"/><path d="M 0 110 C 12 46 44 16 110 8" fill="none" stroke="#4A3C78" stroke-width="2"/><path d="M 0 110 C 18 60 52 26 110 14" fill="none" stroke="#7E6FAE" stroke-width="1.6"/><path d="M 0 110 C 26 74 60 40 110 22" fill="none" stroke="#B3A8D3" stroke-width="1.6"/><text x="55" y="128" font-size="8.5" fill="#5A6570" text-anchor="middle">false positive rate</text><text transform="translate(-14,55) rotate(-90)" font-size="8.5" fill="#5A6570" text-anchor="middle">true positive rate</text></g>
    <text x="190" y="440" font-size="9.5" fill="#45505A"><tspan x="190" dy="0">ROC and AUROC computed for</tspan><tspan x="190" dy="14">each of the 14 pathologies on</tspan><tspan x="190" dy="14">the held-out split, then macro-</tspan><tspan x="190" dy="14">averaged across labels</tspan><tspan x="190" dy="20">Class imbalance is absorbed by</tspan><tspan x="190" dy="14">the frequency-weighted loss</tspan></text>
    <text x="460" y="410" font-size="12.5" font-weight="700">g</text><text x="476" y="410" font-size="12" font-weight="600">Benchmark against radiologists</text>
    <g transform="translate(464,432)"><line x1="0" y1="100" x2="226" y2="100" stroke="#6B7780" stroke-width="1.1"/><g fill="#4A3C78"><rect x="0" y="34" width="12" height="66"/><rect x="33" y="26" width="12" height="74"/><rect x="66" y="42" width="12" height="58"/><rect x="99" y="38" width="12" height="62"/><rect x="132" y="20" width="12" height="80"/><rect x="165" y="46" width="12" height="54"/><rect x="198" y="30" width="12" height="70"/></g><g fill="#C3B9DE"><rect x="14" y="38" width="12" height="62"/><rect x="47" y="30" width="12" height="70"/><rect x="80" y="36" width="12" height="64"/><rect x="113" y="42" width="12" height="58"/><rect x="146" y="24" width="12" height="76"/><rect x="179" y="40" width="12" height="60"/><rect x="212" y="34" width="12" height="66"/></g><rect x="0" y="110" width="9" height="9" fill="#4A3C78"/><text x="13" y="118" font-size="8" fill="#5A6570">model</text><rect x="62" y="110" width="9" height="9" fill="#C3B9DE"/><text x="75" y="118" font-size="8" fill="#5A6570">radiologist panel</text></g>
    <text x="706" y="440" font-size="9.5" fill="#45505A"><tspan x="706" dy="0">AUC per pathology set</tspan><tspan x="706" dy="14">against the radiologist</tspan><tspan x="706" dy="14">panel reported in the</tspan><tspan x="706" dy="14">published CheXNeXt</tspan><tspan x="706" dy="14">study</tspan></text>
    <text x="876" y="410" font-size="12.5" font-weight="700">h</text><text x="892" y="410" font-size="12" font-weight="600">Clinical-notes validation</text>
    <g transform="translate(882,428)"><rect x="0" y="0" width="96" height="110" rx="3" fill="#ffffff" stroke="#2C5F7C" stroke-width="1.3"/><path d="M 3 0 L 93 0 Q 96 0 96 3 L 96 16 L 0 16 L 0 3 Q 0 0 3 0 z" fill="#2C5F7C"/><path d="M 0 32 L 96 32 M 0 48 L 96 48 M 0 64 L 96 64 M 0 80 L 96 80 M 0 96 L 96 96 M 32 16 L 32 110 M 64 16 L 64 110" stroke="#A9C1D0" stroke-width="0.9" fill="none"/><g fill="#7FA6BC"><rect x="4" y="21" width="24" height="6" rx="2"/><rect x="36" y="37" width="24" height="6" rx="2"/><rect x="68" y="53" width="24" height="6" rx="2"/><rect x="4" y="69" width="24" height="6" rx="2"/><rect x="36" y="85" width="24" height="6" rx="2"/><rect x="68" y="101" width="24" height="6" rx="2"/></g></g>
    <text x="998" y="442" font-size="9.5" fill="#45505A"><tspan x="998" dy="0">Hospital clinical notes held as</tspan><tspan x="998" dy="14">an XLSX table and cross-</tspan><tspan x="998" dy="14">referenced against image-level</tspan><tspan x="998" dy="14">predictions to check label</tspan><tspan x="998" dy="14">plausibility at case level</tspan></text>
    <text x="24" y="602" font-size="10.5" fill="#2A3440"><tspan font-weight="700">Figure 1 |</tspan> Data flow of the thoracic radiograph classification study. A frontal chest radiograph (a) is resized and standardised (b), then passed through a</text>
    <text x="24" y="618" font-size="10.5" fill="#2A3440">DenseNet121 backbone trained with a frequency-weighted binary cross-entropy (c), producing a 14-element probability vector (d) and Grad-CAM localisation maps (e).</text>
    <text x="24" y="634" font-size="10.5" fill="#2A3440">Discrimination is assessed by per-pathology AUROC (f), benchmarked against published radiologist performance (g) and cross-checked against clinical notes (h). Bars, curves and heatmaps are schematic.</text>
  </g>
</svg>
